<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:#010409; }
  ::selection { background: rgba(79,142,247,0.30); }
  @keyframes mb-rise { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes mb-shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .mb-inp:focus-within { border-color:#4F8EF7 !important; box-shadow:0 0 0 3px rgba(79,142,247,0.15); }
  .mb-primary:hover { background:#6BA0F8 !important; }
  .mb-scrn:hover { background:#21262D !important; color:#E6EDF3 !important; }
  .mb-demo:hover { color:#E6EDF3 !important; border-color:#484F58 !important; }
</style>
</helmet>
<div style="min-height:100vh; font-family:'Inter',system-ui,sans-serif; color:#E6EDF3; background:#010409; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px;">

  <a href="Mosaic Landing.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:#E6EDF3; margin-bottom:34px;">
    <div style="display:grid; grid-template-columns:repeat(3,7px); grid-template-rows:repeat(3,7px); gap:2px;"><div style="background:#4F8EF7;"></div><div style="background:#2D4A77;"></div><div style="background:#4F8EF7;"></div><div style="background:#2D4A77;"></div><div style="background:#4F8EF7;"></div><div style="background:#3FB950;"></div><div style="background:#4F8EF7;"></div><div style="background:#3FB950;"></div><div style="background:#2D4A77;"></div></div>
    <span style="font-weight:700; font-size:19px;">Mosaic</span>
  </a>

  <div style="width:100%; max-width:400px;">
    <div style="text-align:center; margin-bottom:28px;">
      <h1 style="font-size:26px; font-weight:800; letter-spacing:-0.03em; margin:0 0 8px;">Join a room</h1>
      <p style="font-size:14px; color:#7D8590; margin:0;">Enter the 6-digit code your team lead shared. No account needed.</p>
    </div>

    <div style="border:1px solid {{ cardBorder }}; border-radius:16px; background:#0D1117; padding:28px; animation:{{ cardAnim }};">
      <!-- code -->
      <label style="font-size:12px; color:#7D8590; display:block; margin-bottom:10px; text-align:center;">Room code</label>
      <div style="display:flex; gap:8px; justify-content:center; margin-bottom:6px;">
        <sc-for list="{{ digits }}" as="d" hint-placeholder-count="6"><span style="width:46px; height:56px; border:1px solid {{ d.border }}; border-radius:10px; background:#161B22; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:{{ d.color }};">{{ d.c }}</span></sc-for>
      </div>

      <!-- error -->
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:center; gap:8px; justify-content:center; margin-top:14px; font-size:13px; color:#F85149;"><span>⚠</span>{{ errorMsg }}</div>
      </sc-if>

      <!-- display name -->
      <sc-if value="{{ noError }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:22px;">
          <label style="font-size:12px; color:#7D8590; display:block; margin-bottom:8px;">Display name</label>
          <div class="mb-inp" style="display:flex; align-items:center; border:1px solid #30363D; border-radius:9px; background:#161B22; padding:0 13px; transition:all .15s;"><input value="Devin Park" style="flex:1; background:none; border:none; outline:none; color:#E6EDF3; font-family:'Inter',sans-serif; font-size:14px; padding:11px 0;" /><span style="font-size:11px; color:#484F58;">guest</span></div>
        </div>
        <a href="Mosaic Lobby.dc.html" class="mb-primary" style="display:block; text-align:center; background:#4F8EF7; color:#fff; text-decoration:none; font-size:14px; font-weight:600; padding:13px; border-radius:9px; margin-top:18px; transition:background .15s;">Join room →</a>
      </sc-if>

      <!-- error retry -->
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ reset }}" class="mb-primary" style="width:100%; background:#4F8EF7; color:#fff; border:none; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; padding:13px; border-radius:9px; margin-top:20px; cursor:pointer; transition:background .15s;">Try another code</button>
      </sc-if>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:13px; color:#7D8590;">Have an account? <a href="Mosaic Auth.dc.html" style="color:#4F8EF7; text-decoration:none;">Log in</a> to save your history.</div>

    <!-- demo state switcher -->
    <div style="margin-top:30px; border-top:1px solid #21262D; padding-top:18px;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:#484F58; text-align:center; margin-bottom:10px;">Demo · error states</div>
      <div style="display:flex; gap:7px; justify-content:center; flex-wrap:wrap;">
        <button onClick="{{ setOk }}" class="mb-demo" style="font-size:12px; border:1px solid {{ okB }}; background:#161B22; color:{{ okC }}; border-radius:7px; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;">Valid</button>
        <button onClick="{{ setInvalid }}" class="mb-demo" style="font-size:12px; border:1px solid {{ invB }}; background:#161B22; color:{{ invC }}; border-radius:7px; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;">Invalid code</button>
        <button onClick="{{ setFull }}" class="mb-demo" style="font-size:12px; border:1px solid {{ fullB }}; background:#161B22; color:{{ fullC }}; border-radius:7px; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;">Room full</button>
        <button onClick="{{ setClosed }}" class="mb-demo" style="font-size:12px; border:1px solid {{ clsB }}; background:#161B22; color:{{ clsC }}; border-radius:7px; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;">Room closed</button>
      </div>
    </div>
  </div>

  <!-- launcher -->
  <div style="position:fixed; right:20px; bottom:20px; z-index:90;">
    <sc-if value="{{ launcherOpen }}" hint-placeholder-val="{{ false }}">
      <div style="width:220px; background:#161B22; border:1px solid #30363D; border-radius:12px; box-shadow:0 20px 50px rgba(0,0,0,0.6); padding:10px; margin-bottom:10px; animation:mb-rise .15s ease;">
        <a href="Mosaic Landing.dc.html" class="mb-scrn" style="display:block; padding:6px 8px; border-radius:6px; color:#7D8590; text-decoration:none; font-size:12.5px;">← Landing</a>
        <a href="Mosaic Lobby.dc.html" class="mb-scrn" style="display:block; padding:6px 8px; border-radius:6px; color:#7D8590; text-decoration:none; font-size:12.5px;">Room Lobby →</a>
        <a href="Mosaic Handoff.dc.html" class="mb-scrn" style="display:block; padding:6px 8px; border-radius:6px; color:#4F8EF7; text-decoration:none; font-size:12.5px;">★ All screens</a>
      </div>
    </sc-if>
    <button onClick="{{ toggleLauncher }}" style="display:flex; align-items:center; gap:8px; background:#161B22; border:1px solid #30363D; color:#E6EDF3; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:9px 14px; border-radius:999px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,0.5);">
      <span style="display:grid; grid-template-columns:repeat(2,4px); grid-template-rows:repeat(2,4px); gap:2px;"><span style="background:#4F8EF7;"></span><span style="background:#3FB950;"></span><span style="background:#A371F7;"></span><span style="background:#D29922;"></span></span>
      Screens
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode:'ok', launcherOpen:false };
  renderVals() {
    const m = this.state.mode;
    const err = m!=='ok';
    const codeStr = m==='invalid' ? '8XQ2PP' : '4K7P2X';
    const digitColor = err ? '#F85149' : '#4F8EF7';
    const digitBorder = err ? 'rgba(248,81,73,0.4)' : '#30363D';
    const msgs = { invalid:'No room found with that code. Check for typos.', full:'This room is full (6/6). Ask the lead to bump the limit.', closed:'This room has closed. The merge already happened.' };
    const b = (on) => on?'#4F8EF7':'#30363D';
    const c = (on) => on?'#4F8EF7':'#7D8590';
    return {
      digits: codeStr.split('').map(ch => ({ c: ch, color: digitColor, border: digitBorder })),
      hasError: err, noError: !err, errorMsg: msgs[m] || '',
      cardBorder: err ? 'rgba(248,81,73,0.35)' : '#30363D',
      cardAnim: err ? 'mb-shake .35s ease' : 'mb-rise .25s ease',
      okB:b(m==='ok'), okC:c(m==='ok'), invB:b(m==='invalid'), invC:c(m==='invalid'),
      fullB:b(m==='full'), fullC:c(m==='full'), clsB:b(m==='closed'), clsC:c(m==='closed'),
      setOk:()=>this.setState({mode:'ok'}), setInvalid:()=>this.setState({mode:'invalid'}),
      setFull:()=>this.setState({mode:'full'}), setClosed:()=>this.setState({mode:'closed'}),
      reset:()=>this.setState({mode:'ok'}),
      launcherOpen: this.state.launcherOpen,
      toggleLauncher: () => this.setState(s => ({ launcherOpen: !s.launcherOpen })),
    };
  }
}
</script>
</body>
</html>
